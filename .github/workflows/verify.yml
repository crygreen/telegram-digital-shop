name: Verify ShopBot

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Build and verify persistent SQLite
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose build
          docker compose run --rm --entrypoint python shopbot -c 'import database; database.init_db(); database.set_status("online")'
          docker compose run --rm --entrypoint python shopbot -c 'import database; assert database.get_status() == "online"'
